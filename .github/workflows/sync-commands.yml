name: Sync Command Catalog from Framework

# Keeps data/commands.json (the source for "MT DevOps: Run Command...")
# from drifting out of sync with the framework's own COMMANDS.md, which
# used to require someone remembering to run `npm run sync-commands` by
# hand. mt-devops-framework's release workflow fires a repository_dispatch
# here whenever a push to its main branch actually changes COMMANDS.md;
# workflow_dispatch is kept as a manual escape hatch (e.g. to re-sync
# after fixing this workflow itself, without needing a real framework
# change to re-trigger it).
on:
  repository_dispatch:
    types: [framework-commands-updated]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate Command Catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Extension Pack
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Checkout mt-devops-framework
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MatStacey/mt-devops-framework
          path: mt-devops-framework
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Regenerate data/commands.json
        env:
          MT_COMMANDS_MD: ${{ github.workspace }}/mt-devops-framework/COMMANDS.md
        run: node packages/mt-devops-companion/scripts/generate-commands.mjs

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- packages/mt-devops-companion/data/commands.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with the updated catalog
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FRAMEWORK_SHA: ${{ github.event.client_payload.framework_sha || 'manual run' }}
          FRAMEWORK_TAG: ${{ github.event.client_payload.framework_tag || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/sync-command-catalog-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add packages/mt-devops-companion/data/commands.json
          git commit -m "chore: sync command catalog from mt-devops-framework${FRAMEWORK_TAG:+ ($FRAMEWORK_TAG)}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync command catalog from mt-devops-framework${FRAMEWORK_TAG:+ ($FRAMEWORK_TAG)}" \
            --body "Auto-generated by the Sync Command Catalog workflow -- mt-devops-framework's COMMANDS.md changed (commit \`${FRAMEWORK_SHA}\`). Regenerated via \`node packages/mt-devops-companion/scripts/generate-commands.mjs\`; review the diff before merging." \
            --base main \
            --head "$BRANCH"
