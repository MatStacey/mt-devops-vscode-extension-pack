name: Automated VSCode Extension Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Calculate SemVer and Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Update package.json versions and package VSIXes
        run: |
          # Strip the 'v' prefix for npm version to strictly bump package.json
          RAW_VERSION="${{ steps.tag_version.outputs.new_version }}"
          mkdir -p release
          for pkg_dir in packages/*/; do
            (
              cd "$pkg_dir"
              npm version "$RAW_VERSION" --allow-same-version --no-git-tag-version
              # Manifest-only extension packs have no dependencies, so this
              # is a fast no-op for them -- but a coded package (like
              # mt-devops-companion) needs its devDependencies (esbuild,
              # typescript) actually installed before vsce's
              # vscode:prepublish step can bundle it.
              npm install
              npx @vscode/vsce package -o "../../release/"
            )
          done
          echo "VSIX_FILES=release/*.vsix" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: |
            ## 🚀 What's Changed in ${{ steps.tag_version.outputs.new_tag }}

            ${{ steps.tag_version.outputs.changelog }}
          generate_release_notes: true
          files: ${{ env.VSIX_FILES }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
